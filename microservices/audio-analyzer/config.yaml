app:
  name: Audio Analyzer
  cleanup_on_exit: true
  clear_storage_on_startup: true  # delete all session folders under storage/ at startup
  use_ov_genai: True # True or False, applicable for provider: openvino

models:
  asr:
    provider: openai # openai | openvino | whispercpp
    name: whisper-base  # whisper-tiny | whisper-base | whisper-small | whisper-medium | whisper-large
    device: CPU # CPU recommended; CPU only for whispercpp, CPU or GPU for openvino provider
    weight_format: null # OpenVINO: int8 | fp16 | null. whispercpp: null | q5 | q5_0 | q5_1 | q8 | q8_0 | int5 | int8
    temperature: 0.0
    diarization: False
    hf_token: None   # needed only if diarization=true
    models_base_path: "models"

    # Hallucination filtering — openai provider uses native no_speech_prob/avg_logprob.
    # whispercpp derives the same values from per-token plog and ptsum.
    # openvino genai pipelines do not expose these fields; filtering is skipped.
    #
    # Values below were re-tuned after enabling audio_preprocessing.denoise
    # (RNNoise). With denoising active, background noise is far less likely to
    # be mistaken for speech, so these thresholds were relaxed from the
    # previous "live noisy microphone" preset toward openai-whisper's own
    # defaults (no_speech_threshold=0.6, logprob_threshold=-1.0) — but not
    # all the way, since some live-mic margin is still warranted. This
    # reduces false-positive drops of short/quiet real speech (previously the
    # stricter values were more likely to discard legitimate short utterances
    # as "silence").
    # Lower no_speech_threshold → stricter: flags more segments as potential noise.
    # Higher logprob_threshold  → stricter: drops low-confidence transcriptions.
    # Higher min_duration_sec / min_words → harder for noise bursts to earn the
    #   "definitely speech, keep" safety net in _is_silent_segment().
    no_speech_threshold: 0.5
    logprob_threshold: -0.6
    min_duration_sec: 0.3
    min_words: 1

    # openai-whisper transcribe() native param: skip generation over silent
    # regions longer than this many seconds.  Directly targets the
    # noise-transcribed-as-text problem.  null = disabled.
    hallucination_silence_threshold: 1.0

    # Post-processing repetition filter (all providers).
    # 1.0 = disabled. Any value > 1.0 enables consecutive repeated-phrase
    # removal (word n-gram dedup, window 1-8) and duplicate-segment stripping.
    # Note: openai-whisper's DecodingOptions has no repetition_penalty field;
    # this is applied after transcription, not inside the decoder.
    repetition_penalty: 1.8

    # Decoder controls — beam_size/best_of apply to openai and whispercpp.
    # word_timestamps and threads are whisper.cpp specific.
    # beam_size=3 enables real beam search (was 1 = greedy no-op); trades a
    # small amount of latency for improved decoding accuracy on ambiguous audio.
    beam_size: 3
    best_of: 1
    word_timestamps: false
    threads: 0

    # openai-whisper's own robustness mechanism: retries decoding at
    # increasing temperature when the compression_ratio/logprob checks judge
    # the previous attempt low-confidence, instead of committing to a single
    # (often 0.0/greedy) decode. See components/asr/openai/whisper.py.
    temperature_fallback: true

  diarization: # Only applicable when models.asr.diarization is set to True
    provider: "huggingface"
    name: "pyannote/speaker-diarization-community-1"
    device: CPU  # CPU or GPU
    models_base_path: "models"
    min_speakers: 1   # kiosk scenario: at most 1 customer + 1 staff member per chunk
    max_speakers: 2

    # Cross-chunk primary-speaker identity resolution. Reuses the speaker
    # embeddings already computed by the diarization pipeline during
    # clustering (pyannote DiarizeOutput.speaker_embeddings) — no extra
    # model is loaded. See components/asr/diarization/speaker_identity.py
    identity:
      enabled: true
      similarity_threshold: 0.75   # cosine similarity to match stored primary
      lock_min_duration_sec: 0.75  # min turn duration before it can be locked as primary
      session_ttl_seconds: 1800    # evict idle session identity state after 30 min

audio_preprocessing:
  chunk_duration_sec: 15
  silence_threshold: -35  # in dB
  silence_duration: 0.3   # minimum silence length in seconds
  # How far to look for a real silence gap if none falls exactly at the ideal
  # chunk boundary. Widened from 1s -> 2s so a hard cut (which can land
  # mid-word) is less likely when speech is continuous near the 15s mark.
  search_window_sec: 2
  chunk_output_path: chunks/
  denoise: true           # applies an ffmpeg denoise filter before chunking/ASR.
                           # Enabled: reduces background/room noise, which both
                           # improves ASR accuracy directly and makes the
                           # silencedetect-based chunk boundary above more
                           # reliable (noise floor no longer masks real pauses).
  denoise_model: ""       # path to .rnnn RNNoise model file (arnndn filter).
                           # IMPORTANT: ffmpeg's arnndn filter has NO built-in
                           # default model and fails to initialize without one
                           # (verified: `arnndn` alone raises "Error
                           # initializing filters"). No .rnnn model ships with
                           # this repo/image, so when this is left empty the
                           # denoise stage uses `afftdn` (ffmpeg's model-free
                           # FFT denoiser) instead. Set this to a valid .rnnn
                           # path to opt into arnndn/RNNoise, which generally
                           # performs better on speech when a trained model
                           # is available.

  # Per-chunk loudness normalization, applied after denoise and before the
  # chunk is handed to ASR. dynaudnorm is used (not loudnorm/EBU R128)
  # because each 15s chunk is processed independently with no shared
  # analysis pass across a session — dynaudnorm is a single-pass, frame-local
  # adaptive-gain filter designed for exactly this streaming/short-buffer
  # case, whereas loudnorm's single-pass mode assumes a fixed/default input
  # loudness and its accurate mode requires a separate two-pass measurement
  # over the *whole* file, which does not fit this per-chunk pipeline and
  # would cause inconsistent loudness jumps between independently-normalized
  # chunks.
  normalize: true
  normalize_filter: dynaudnorm

audio_util:
  max_size_mb: 200
  allowed_extensions:
    - .wav
    - .mp3
    - .m4a
    - .mp4    # video containers accepted for VSS transcription requests;
    - .mkv    # ffmpeg-based chunking extracts the audio track automatically,
    - .mov    # no separate audio-extraction step is required.
    - .avi
  chunk_size: 52428800   # 1024 * 1024 * 50 = 50MB

# MinIO object storage — used only by the VSS-compatibility endpoint
# (POST /transcriptions) to retrieve source videos and store transcripts
# back into the same bucket the caller (VSS pipeline-manager) reads from.
# Not used by any other endpoint. All values overridable via
# AUDIO_ANALYZER__MINIO__<KEY> env vars.
minio:
  endpoint: ""       # e.g. "minio-server:9000"; empty disables MinIO support
  access_key: ""
  secret_key: ""
  secure: false

pipeline:
  delete_chunks_after_use: true

sentiment:
  enabled: false                  # set true to enable parallel voice sentiment analysis
  model: speechbrain/emotion-recognition-wav2vec2-IEMOCAP
  device: CPU                     # CPU | GPU (openvino export only)
  provider: openvino              # openvino | pytorch
  weight_format: int8             # Optional OpenVINO export precision, e.g. int8 | fp16
  models_base_path: "models"
  # Aggregation — how to compute session-level sentiment from per-chunk results
  # recency_weight: higher weight on recent chunks (good for kiosk drift detection)
  recency_weight: 0.7             # 0.0 = equal weight, 1.0 = last chunk only
  peak_label: angry               # label to watch for peak/escalation detection
